name: Weekly database backup

# pg_dump of the PRODUCTION database, every Monday 03:00 Malaysia time (Sunday 19:00 UTC), and on demand.
# The repository is PUBLIC, and anyone signed in to GitHub can download a public repo's artifacts, so
# the dump is encrypted (AES-256, gpg) with BACKUP_PASSPHRASE before upload. Kept 90 days.
# Secrets (Settings -> Secrets and variables -> Actions): PROD_DATABASE_URL, BACKUP_PASSPHRASE.
# Restore steps: _specs/16-production-setup.md, section "Restore a backup".

on:
  schedule:
    - cron: "0 19 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    if: github.repository == 'apeqjualsayur/masjid-tv'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Check the secrets are set
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error::PROD_DATABASE_URL and BACKUP_PASSPHRASE must both be set as repository secrets."
            exit 1
          fi
          if [ "${#BACKUP_PASSPHRASE}" -lt 20 ]; then
            echo "::error::BACKUP_PASSPHRASE is too short (use at least 20 characters)."
            exit 1
          fi

      - name: Install pg_dump 17 (same major version as Supabase Postgres)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common >/dev/null
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y >/dev/null
          sudo apt-get install -y -qq postgresql-client-17 >/dev/null
          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: Dump and encrypt
        run: |
          set -euo pipefail
          umask 077
          stamp=$(date -u +%Y-%m-%dT%H%MZ)
          echo "STAMP=$stamp" >> "$GITHUB_ENV"
          # Custom format: everything in the database (public tables, auth users, storage object rows).
          # Files in Storage (logos, posters) are not in the database; see the restore notes.
          /usr/lib/postgresql/17/bin/pg_dump "$DATABASE_URL" --format=custom --compress=9 --no-owner --no-privileges \
            --file="masjidview-prod-$stamp.dump"
          size=$(stat -c %s "masjidview-prod-$stamp.dump")
          echo "Dump size: $size bytes"
          if [ "$size" -lt 10000 ]; then echo "::error::Dump is suspiciously small ($size bytes)."; exit 1; fi
          /usr/lib/postgresql/17/bin/pg_restore --list "masjidview-prod-$stamp.dump" > /dev/null
          gpg --batch --yes --quiet --pinentry-mode loopback --passphrase-fd 3 \
            --symmetric --cipher-algo AES256 --output "masjidview-prod-$stamp.dump.gpg" "masjidview-prod-$stamp.dump" \
            3<<< "$BACKUP_PASSPHRASE"
          shred -u "masjidview-prod-$stamp.dump"
          ls -l masjidview-prod-*.gpg

      - name: Upload (encrypted, 90 days)
        uses: actions/upload-artifact@v4
        with:
          name: masjidview-prod-${{ env.STAMP }}
          path: masjidview-prod-*.dump.gpg
          retention-days: 90
          if-no-files-found: error
          compression-level: 0