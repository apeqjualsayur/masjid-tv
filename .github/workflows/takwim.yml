name: Takwim check

# Weekly check of the Hari Kebesaran takwim (PRD enhancements §5.2; scripts/takwim-sync.ts):
# reads JAKIM's "Tarikh Penting dalam Islam" lists on e-Solat, adds MISSING future dates as Jangkaan
# (never changes a row already in the table), and keeps one open GitHub issue (label "takwim") with
# what the platform owner should do: check and Sahkan new dates, enter scanned years and Nisfu
# Syaaban by hand, confirm Ramadan / Syawal / Aidiladha after the announcement.
# Secrets (Settings -> Secrets and variables -> Actions): SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY.
# Runs only on the schedule and by hand (never for pull requests), so the key is never exposed.

on:
  schedule:
    - cron: "0 1 * * 1" # Mondays 09:00 Malaysia time
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: takwim-check
  cancel-in-progress: false

jobs:
  check:
    if: github.repository == 'apeqjualsayur/masjid-tv'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check the secrets are set
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY must both be set as repository secrets."
            exit 1
          fi

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci

      - name: Read JAKIM's lists and add missing dates
        run: npx tsx scripts/takwim-sync.ts --write --report=takwim-report.md

      - name: Open or update the takwim issue
        run: |
          set -euo pipefail
          if [ ! -s takwim-report.md ]; then
            echo "Nothing needs the owner."
            exit 0
          fi
          gh label create takwim --color 146C4A --description "Hari Kebesaran takwim" --force >/dev/null
          num=$(gh issue list --label takwim --state open --json number --jq '.[0].number // empty')
          if [ -z "$num" ]; then
            gh issue create --title "Takwim: action needed" --label takwim --body-file takwim-report.md
          else
            old=$(gh issue view "$num" --json body --jq .body)
            if [ "$old" != "$(cat takwim-report.md)" ]; then
              gh issue edit "$num" --body-file takwim-report.md
              gh issue comment "$num" --body "The takwim check found something new ($(date -u +%Y-%m-%d)). See the updated description."
            else
              echo "Issue #$num is already up to date."
            fi
          fi
