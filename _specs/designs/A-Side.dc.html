<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<title>Bar Sisi dan Poster</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Noto+Naskh+Arabic:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#F5D33B}a:hover{color:#FFFFFF}
</style>
</helmet>
<div style="position: relative; width: 1920px; height: 1080px; overflow: hidden; font-family: 'Plus Jakarta Sans', sans-serif; color: #FFFFFF">
<div style="position: absolute; inset: 0; background: {{p.sky}}"></div>
<svg aria-hidden="true" width="1920" height="1080" viewBox="0 0 1920 1080" style="position: absolute; inset: 0">
<defs>
<radialGradient id="glow">
<stop offset="0" stop-color="{{p.sunC}}" stop-opacity="0.9"></stop>
<stop offset="0.35" stop-color="{{p.sunC}}" stop-opacity="0.3"></stop>
<stop offset="1" stop-color="{{p.sunC}}" stop-opacity="0"></stop>
</radialGradient>
</defs>
<g fill="#FFFFFF" opacity="{{p.starOp}}">
<circle cx="1400" cy="80" r="2"></circle><circle cx="1500" cy="300" r="1.5"></circle><circle cx="1660" cy="140" r="2.2"></circle><circle cx="1780" cy="420" r="1.4"></circle><circle cx="1860" cy="60" r="1.8"></circle><circle cx="1720" cy="560" r="1.5"></circle>
</g>
<circle cx="{{p.sx}}" cy="{{p.sy}}" r="{{p.glowR}}" fill="url(#glow)"></circle>
<circle cx="{{p.sx}}" cy="{{p.sy}}" r="{{p.sr}}" fill="{{p.sunC}}"></circle>
<path fill="{{p.l1}}" opacity="0.85" d="M0 760 L180 690 L340 730 L520 640 L700 700 L880 620 L1060 690 L1240 610 L1420 680 L1600 630 L1780 690 L1920 650 L1920 1080 L0 1080 Z"></path>
<path fill="{{p.l2}}" d="M0 840 C200 780 380 800 560 820 S920 760 1120 800 S1500 840 1700 790 S1880 800 1920 810 L1920 1080 L0 1080 Z"></path>
<path fill="{{p.l3}}" d="M0 900 C260 860 520 880 760 900 S1240 940 1500 900 S1800 880 1920 890 L1920 1080 L0 1080 Z"></path>
</svg>

<div style="position: absolute; top: 36px; left: 36px; width: 1280px; height: 1008px; border-radius: 28px; overflow: hidden; background: #0C1A16; box-shadow: 0 24px 60px rgba(0,0,0,0.3)">
<div style="position: absolute; inset: -80px; background: linear-gradient(160deg, #2E9A6B 0%, #0F3D2E 55%, #E9C53A 100%); filter: blur(70px); opacity: 0.75"></div>
<div style="position: absolute; inset: 0; background: rgba(0,0,0,0.22)"></div>
<div style="position: absolute; top: 0; bottom: 0; left: 262px; width: 756px; background: #F3F8F5; color: #0F2E24; display: flex; flex-direction: column; box-shadow: 0 0 60px rgba(0,0,0,0.35)">
<div style="height: 220px; background: linear-gradient(160deg, #2E9A6B 0%, #0F3D2E 100%)"></div>
<div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 48px; text-align: center; color: #1F7A55">
<svg aria-hidden="true" width="110" height="110" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"></rect><circle cx="9" cy="9" r="2"></circle><path d="M21 15l-5-5L5 21"></path></svg>
<div style="font-size: 36px; font-weight: 800; color: #0F2E24">Poster dimuat naik oleh AJK</div>
<div style="font-size: 24px; font-weight: 500; color: #4D6B5F; line-height: 1.4">Potret 3:4 atau A4 dipaparkan penuh tanpa dipotong. Ruang kosong diisi kabur daripada poster itu sendiri.</div>
</div>
<div style="height: 120px; background: #E9C53A"></div>
</div>
<div style="position: absolute; top: 24px; right: 24px; padding: 10px 18px; border-radius: 999px; background: rgba(8,18,28,0.5); border: 1px solid rgba(255,255,255,0.25); font-size: 20px; font-weight: 700">2 / 6</div>
</div>

<div style="position: absolute; top: 36px; left: 1340px; width: 544px; height: 1008px; box-sizing: border-box; padding: 36px 30px; border-radius: 28px; background: rgba(4,14,18,0.42); border: 1px solid rgba(255,255,255,0.2); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); display: flex; flex-direction: column; gap: 22px">
<div style="display: flex; align-items: center; gap: 16px">
<div style="width: 64px; height: 64px; flex-shrink: 0; border-radius: 999px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 800; color: #1F7A55">NM</div>
<div style="display: flex; flex-direction: column; gap: 2px">
<div style="font-size: 26px; font-weight: 700; line-height: 1.15">Nama Masjid / Surau</div>
<div style="font-size: 18px; font-weight: 500; opacity: 0.85">Zon JAKIM SGR01</div>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 2px">
<div style="font-size: 23px; font-weight: 700">Sabtu, 17 Oktober 2026</div>
<div style="font-size: 20px; font-weight: 500; opacity: 0.85">6 Jamadilawal 1448H</div>
</div>
<div style="display: flex; align-items: baseline; gap: 10px">
<div style="font-size: 138px; font-weight: 700; letter-spacing: -5px; line-height: 0.92; font-variant-numeric: tabular-nums">{{p.clock}}</div>
<div style="font-size: 42px; font-weight: 600; opacity: 0.75; font-variant-numeric: tabular-nums">{{p.sec}}</div>
</div>
<div style="display: flex">
<div style="padding: 10px 20px; border-radius: 999px; background: rgba(245,211,59,0.16); border: 1px solid rgba(245,211,59,0.6); color: #F5D33B; font-size: 21px; font-weight: 700">{{p.countdown}}</div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px; margin-top: 4px">
<sc-for list="{{waktu}}" as="w" hint-placeholder-count="7">
<div style="display: flex; align-items: center; gap: 14px; padding: 12px 18px; border-radius: 18px; background: {{w.bg}}; border: {{w.border}}; color: {{w.fg}}">
<svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{w.icon}}"></path></svg>
<div style="font-size: 24px; font-weight: 700; flex: 1">{{w.name}}</div>
<sc-if value="{{showArabic}}" hint-placeholder-val="{{true}}">
<div style="font-family: 'Noto Naskh Arabic', serif; font-size: 20px; opacity: 0.8">{{w.ar}}</div>
</sc-if>
<div style="font-size: 34px; font-weight: 800; letter-spacing: -1px; font-variant-numeric: tabular-nums; min-width: 92px; text-align: right">{{w.time}}</div>
</div>
</sc-for>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"phase":{"editor":"enum","options":["subuh","zohor","asar","maghrib","isyak"],"default":"isyak","section":"Waktu"},"showArabic":{"editor":"boolean","default":true,"section":"Bahasa"},"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    const P = {
      subuh:   { clock: '6:12', sec: '08', countdown: 'Syuruk dalam 49 minit', cur: 1, next: 2,
                 sky: 'linear-gradient(180deg,#0E1A3D 0%,#24407E 45%,#6F7FB8 72%,#F2B27A 100%)',
                 sunC: '#FFD9A8', sx: 1600, sy: 820, sr: 60, glowR: 420, starOp: 0.7, l1: '#3A4F8F', l2: '#22346A', l3: '#121F45' },
      zohor:   { clock: '1:20', sec: '36', countdown: 'Asar dalam 2 jam 51 minit', cur: 3, next: 4,
                 sky: 'linear-gradient(180deg,#F7CF6A 0%,#F2AE3C 45%,#E58A27 100%)',
                 sunC: '#FFF4D2', sx: 1700, sy: 160, sr: 100, glowR: 480, starOp: 0, l1: '#D9822B', l2: '#B5611C', l3: '#7A3D10' },
      asar:    { clock: '4:42', sec: '15', countdown: 'Maghrib dalam 2 jam 24 minit', cur: 4, next: 5,
                 sky: 'linear-gradient(180deg,#F6A15A 0%,#E2673A 48%,#9E3320 100%)',
                 sunC: '#FFE0B0', sx: 1640, sy: 560, sr: 95, glowR: 480, starOp: 0, l1: '#9C3A1E', l2: '#6E2412', l3: '#3E1209' },
      maghrib: { clock: '7:15', sec: '50', countdown: 'Isyak dalam 1 jam 01 minit', cur: 5, next: 6,
                 sky: 'linear-gradient(180deg,#2E2D6B 0%,#6C5BA8 45%,#C89BC4 75%,#F4B8A0 100%)',
                 sunC: '#FFD3B5', sx: 1600, sy: 860, sr: 70, glowR: 460, starOp: 0.35, l1: '#6A5AA6', l2: '#463C82', l3: '#251F52' },
      isyak:   { clock: '9:30', sec: '04', countdown: 'Imsak dalam 8 jam 12 minit', cur: 6, next: 0,
                 sky: 'linear-gradient(180deg,#041E26 0%,#0B3F4C 52%,#1E7A85 100%)',
                 sunC: '#E9F6F7', sx: 1760, sy: 150, sr: 40, glowR: 240, starOp: 0.9, l1: '#0F5662', l2: '#0A3B45', l3: '#05232A' }
    };
    const p = P[this.props.phase ?? 'isyak'] || P.isyak;
    const T = [
      { name: 'Imsak',   ar: 'إمساك', time: '5:42', icon: 'M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z' },
      { name: 'Subuh',   ar: 'صبح',   time: '5:52', icon: 'M3 18h18 M7 18a5 5 0 0 1 10 0 M12 5v3 M5.6 9.6l1.8 1.8 M18.4 9.6l-1.8 1.8' },
      { name: 'Syuruk',  ar: 'شروق',  time: '7:01', icon: 'M3 20h18 M6 16a6 6 0 0 1 12 0 M12 3v5 M9 6l3-3 3 3' },
      { name: 'Zohor',   ar: 'ظهر',   time: '1:05', icon: 'M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8Z M12 2v2 M12 20v2 M4.9 4.9l1.4 1.4 M17.7 17.7l1.4 1.4 M2 12h2 M20 12h2 M4.9 19.1l1.4-1.4 M17.7 6.3l1.4-1.4' },
      { name: 'Asar',    ar: 'عصر',   time: '4:11', icon: 'M12 7a4 4 0 1 0 0 8 4 4 0 0 0 0-8Z M12 2v2 M5 5l1.4 1.4 M19 5l-1.4 1.4 M3 20h18' },
      { name: 'Maghrib', ar: 'مغرب',  time: '7:06', icon: 'M3 18h18 M7 18a5 5 0 0 1 10 0 M12 10V3 M9 7l3 3 3-3' },
      { name: 'Isyak',   ar: 'عشاء',  time: '8:16', icon: 'M19 14A7.5 7.5 0 1 1 10 5a6 6 0 0 0 9 9Z M17 3l.7 1.6 1.6.7-1.6.7-.7 1.6-.7-1.6-1.6-.7 1.6-.7Z' }
    ];
    const waktu = T.map((t, i) => {
      const cur = i === p.cur, nxt = i === p.next;
      return Object.assign({}, t, {
        bg: cur ? 'rgba(255,255,255,0.95)' : 'rgba(255,255,255,0.06)',
        border: nxt ? '2px solid #F5D33B' : (cur ? '2px solid rgba(255,255,255,0.95)' : '1px solid rgba(255,255,255,0.14)'),
        fg: cur ? '#0F2E24' : '#FFFFFF'
      });
    });
    return { p, waktu, showArabic: this.props.showArabic ?? true };
  }
}
</script>
</body>
</html>
