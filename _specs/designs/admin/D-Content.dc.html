<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<title>Kandungan komputer</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#146C4A}a:hover{color:#0D4A33}
</style>
</helmet>
<div style="width: 1440px; height: 900px; overflow: hidden; display: flex; background: #F4F7F5; font-family: 'Plus Jakarta Sans', sans-serif; color: #12261E">
<aside style="width: 248px; flex-shrink: 0; background: #FFFFFF; border-right: 1px solid #DCE6E1; box-sizing: border-box; padding: 24px 16px; display: flex; flex-direction: column; gap: 22px">
<div style="display: flex; align-items: center; gap: 10px; padding: 0 8px">
<svg role="img" aria-label="Logo Masjid View" width="34" height="34" viewBox="0 0 76 76"><rect width="76" height="76" rx="22" fill="#146C4A"></rect><path d="M24 58V36a14 14 0 0 1 28 0v22Z" fill="#FFFFFF"></path><circle cx="38" cy="22" r="3.5" fill="#E3B04B"></circle><rect x="32" y="44" width="12" height="14" rx="6" fill="#146C4A"></rect></svg>
<div style="font-size: 18px; font-weight: 800">Masjid View</div>
</div>
<button type="button" style="display: flex; align-items: center; gap: 10px; padding: 10px; border: 1px solid #DCE6E1; border-radius: 14px; background: #F7FAF8; font: inherit; text-align: left; color: #12261E">
<div style="width: 36px; height: 36px; flex-shrink: 0; border-radius: 999px; background: #146C4A; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 800">NM</div>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px"><div style="font-size: 14px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Masjid [Nama]</div><div style="font-size: 12px; color: #51655C">Pentadbir · SGR01</div></div>
<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#51655C" stroke-width="2" stroke-linecap="round"><path d="M7 10l5 5 5-5"></path></svg>
</button>
<nav aria-label="Navigasi utama" style="display: flex; flex-direction: column; gap: 4px">
<sc-for list="{{nav}}" as="n" hint-placeholder-count="5">
<a href="{{n.href}}" aria-current="{{n.cur}}" style="display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; font-weight: {{n.w}}; background: {{n.bg}}; color: {{n.fg}}">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{n.icon}}"></path></svg>{{n.label}}</a>
</sc-for>
</nav>
</aside>

<main style="flex: 1; min-width: 0; box-sizing: border-box; padding: 32px 40px; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; justify-content: space-between; align-items: center">
<div style="font-size: 28px; font-weight: 800; letter-spacing: -0.4px">Kandungan</div>
<div style="display: flex; gap: 10px">
<a href="D-Poster.dc.html" style="height: 44px; padding: 0 18px; border: 1.5px solid #146C4A; border-radius: 12px; display: flex; align-items: center; font-size: 14px; font-weight: 700; text-decoration: none">Muat naik poster</a>
<a href="D-Editor.dc.html" style="height: 44px; padding: 0 18px; border-radius: 12px; background: #146C4A; color: #FFFFFF; display: flex; align-items: center; font-size: 14px; font-weight: 700; text-decoration: none">+ Pengumuman baru</a>
</div>
</div>

<div style="display: flex; align-items: center; gap: 12px">
<div role="tablist" aria-label="Status" style="display: flex; padding: 4px; border-radius: 12px; background: #E3ECE7">
<sc-for list="{{tabs}}" as="tb" hint-placeholder-count="3">
<button type="button" role="tab" aria-selected="{{tb.sel}}" onClick="{{tb.pick}}" style="height: 38px; padding: 0 16px; border: 0; border-radius: 9px; font: inherit; font-size: 14px; font-weight: 700; background: {{tb.bg}}; color: {{tb.fg}}">{{tb.label}}</button>
</sc-for>
</div>
<label for="q" style="position: absolute; left: -9999px">Cari</label>
<input id="q" placeholder="Cari tajuk…" style="height: 44px; width: 260px; border: 1px solid #C9D8D0; border-radius: 12px; padding: 0 14px; font: inherit; font-size: 14px; background: #FFFFFF; box-sizing: border-box">
<select aria-label="Tapis skrin" style="height: 44px; border: 1px solid #C9D8D0; border-radius: 12px; padding: 0 12px; font: inherit; font-size: 14px; background: #FFFFFF; color: #12261E"><option>Semua skrin</option></select>
<div style="margin-left: auto; font-size: 13px; color: #51655C">Seret ⋮⋮ untuk susun giliran paparan</div>
</div>

<div style="background: #FFFFFF; border-radius: 18px; box-shadow: 0 1px 3px rgba(18,38,30,0.08); overflow: hidden">
<div style="display: grid; grid-template-columns: 44px 120px minmax(0, 1fr) 190px 80px 150px 170px 96px 52px; align-items: center; height: 48px; padding: 0 12px; background: #F7FAF8; border-bottom: 1px solid #E6EEEA; font-size: 12px; font-weight: 800; color: #51655C; letter-spacing: 0.04em">
<div></div><div>JENIS</div><div>TAJUK</div><div>TEMPOH</div><div>SAAT</div><div>HARI</div><div>SKRIN</div><div>PAPAR</div><div></div>
</div>
<sc-for list="{{rows}}" as="r" hint-placeholder-count="5">
<div style="display: grid; grid-template-columns: 44px 120px minmax(0, 1fr) 190px 80px 150px 170px 96px 52px; align-items: center; height: 68px; padding: 0 12px; border-bottom: 1px solid #EEF3F0; font-size: 14px; background: {{r.rowBg}}">
<button type="button" aria-label="Seret untuk susun" style="width: 32px; height: 44px; border: 0; background: transparent; color: #8DA096; cursor: grab"><svg aria-hidden="true" width="14" height="18" viewBox="0 0 16 20" fill="currentColor"><circle cx="5" cy="4" r="1.6"></circle><circle cx="11" cy="4" r="1.6"></circle><circle cx="5" cy="10" r="1.6"></circle><circle cx="11" cy="10" r="1.6"></circle><circle cx="5" cy="16" r="1.6"></circle><circle cx="11" cy="16" r="1.6"></circle></svg></button>
<div><span style="display: inline-flex; padding: 4px 10px; border-radius: 999px; background: {{r.bg}}; color: {{r.fg}}; font-size: 12px; font-weight: 800">{{r.type}}</span></div>
<div style="display: flex; align-items: center; gap: 8px; min-width: 0">
<a href="D-Editor.dc.html" style="font-weight: 700; color: #12261E; text-decoration: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.title}}</a>
<sc-if value="{{r.pri}}" hint-placeholder-val="{{false}}"><span style="flex-shrink: 0; padding: 2px 6px; border-radius: 6px; background: #FDE7E2; color: #9B2C14; font-size: 11px; font-weight: 800">Keutamaan</span></sc-if>
</div>
<div style="color: #3A4E45">{{r.dates}}</div>
<div style="color: #3A4E45">{{r.secs}}</div>
<div style="color: #3A4E45">{{r.days}}</div>
<div style="color: #3A4E45; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.screens}}</div>
<div aria-hidden="true" style="position: relative; width: 46px; height: 28px; border-radius: 999px; background: {{r.trk}}"><div style="position: absolute; top: 3px; left: {{r.knob}}; width: 22px; height: 22px; border-radius: 999px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(0,0,0,0.25)"></div></div>
<button type="button" aria-label="Lagi tindakan" style="width: 40px; height: 40px; border: 0; border-radius: 10px; background: transparent; color: #51655C"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="19" cy="12" r="1.8"></circle></svg></button>
</div>
</sc-for>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const I = {
      home: 'M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1Z',
      content: 'M12 3 2 8l10 5 10-5Z M2 13l10 5 10-5',
      screen: 'M4 4h16a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z M8 21h8 M12 17v4',
      settings: 'M4 7h9 M17 7h3 M4 17h3 M11 17h9 M15 5a2 2 0 1 1 0 4 2 2 0 0 1 0-4Z M9 15a2 2 0 1 1 0 4 2 2 0 0 1 0-4Z',
      people: 'M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z M2 21a7 7 0 0 1 14 0 M17 3.5a4 4 0 0 1 0 7.5 M22 21a7 7 0 0 0-4-6.3'
    };
    const active = 'content';
    const nav = [['home', 'Utama', 'D-Home.dc.html'], ['content', 'Kandungan', 'D-Content.dc.html'], ['screen', 'Skrin', '#skrin'], ['settings', 'Tetapan', '#tetapan'], ['people', 'Ahli', '#ahli']]
      .map(([k, label, href]) => ({ label, href, icon: I[k], cur: k === active ? 'page' : 'false', bg: k === active ? '#E3F1EA' : 'transparent', fg: k === active ? '#0D4A33' : '#3A4E45', w: k === active ? 800 : 600 }));
    const tab = (this.state && this.state.tab) || 'aktif';
    const C = { Kematian: ['#ECECEC', '#3A3A3A'], Kuliah: ['#E3F1EA', '#146C4A'], Poster: ['#E6EEF8', '#1F4E8A'], Infaq: ['#FFF1D6', '#8A5300'], 'Imam & Bilal': ['#EEE8F7', '#5B3D8F'], Program: ['#E3F4F4', '#11666A'], Mesyuarat: ['#F7EAE3', '#8A3F14'] };
    const D = {
      aktif: [
        ['Kematian', '[Nama Allahyarham]', '19 – 22 Okt', '20 s', 'Setiap hari', 'Semua skrin', true, true],
        ['Kuliah', 'Kuliah Maghrib: [Tajuk]', '17 – 20 Okt', '15 s', 'Sel', 'Semua skrin', false, true],
        ['Poster', '[Program Hujung Minggu]', '18 – 26 Okt', '15 s', 'Setiap hari', 'Dewan Solat Utama', false, true],
        ['Infaq', 'Tabung [Nama Projek]', 'Berterusan', '15 s', 'Setiap hari', 'Semua skrin', false, true],
        ['Imam & Bilal', 'Jadual minggu ini', '19 – 25 Okt', '20 s', 'Setiap hari', 'Dewan Solat Utama', false, false]
      ],
      dijadual: [
        ['Program', '[Gotong-royong Perdana]', '1 – 8 Nov', '15 s', 'Setiap hari', 'Semua skrin', false, true],
        ['Mesyuarat', '[Mesyuarat Agung]', '3 – 10 Nov', '15 s', 'Setiap hari', 'Semua skrin', false, true]
      ],
      tamat: [
        ['Kuliah', 'Kuliah Subuh: [Tajuk]', '5 – 12 Okt', '15 s', 'Ahd', 'Semua skrin', false, false]
      ]
    };
    const tabs = [['aktif', 'Aktif (5)'], ['dijadual', 'Dijadual (2)'], ['tamat', 'Tamat']].map(([id, label]) => {
      const sel = id === tab;
      return { label, sel, pick: () => this.setState({ tab: id }), bg: sel ? '#FFFFFF' : 'transparent', fg: sel ? '#12261E' : '#51655C' };
    });
    const rows = D[tab].map(([type, title, dates, secs, days, screens, pri, on], i) => ({
      type, title, dates, secs, days, screens, pri, bg: C[type][0], fg: C[type][1],
      trk: on ? '#146C4A' : '#C3D1CA', knob: on ? '21px' : '3px', rowBg: on ? '#FFFFFF' : '#FAFBFA'
    }));
    return { nav, tabs, rows };
  }
}
</script>
</body>
</html>
