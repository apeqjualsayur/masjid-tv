<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<title>Konsep D Iqamah</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Barlow+Condensed:wght@500;600;700&amp;family=Reem+Kufi:wght@500;600&amp;family=Amiri:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#E3B04B}a:hover{color:#FFFFFF}
</style>
</helmet>
<div style="position: relative; width: 1920px; height: 1080px; overflow: hidden; font-family: 'Barlow', sans-serif; background: #0B1114; color: #FFFFFF">

<div style="position: absolute; top: 52px; left: 72px; right: 72px; display: flex; justify-content: space-between; align-items: center">
<div style="display: flex; align-items: center; gap: 16px">
<div style="width: 56px; height: 56px; box-sizing: border-box; border-radius: 999px; border: 2px solid #E3B04B; display: flex; align-items: center; justify-content: center; font-size: 19px; font-weight: 600; color: #E3B04B">NM</div>
<div style="font-size: 26px; font-weight: 600">Nama Masjid / Surau</div>
</div>
<div style="font-size: 26px; font-weight: 500; color: rgba(255,255,255,0.6)">Azan Zohor · 1:05</div>
</div>

<div style="position: absolute; left: 570px; top: 100px; width: 780px; height: 920px; box-sizing: border-box; border: 3px solid #E3B04B; border-radius: 390px 390px 28px 28px; overflow: hidden; background: linear-gradient(180deg, #15332B 0%, #0B1114 100%); box-shadow: 0 0 120px rgba(227,176,75,0.18)">
<div style="position: absolute; left: 0; right: 0; bottom: 0; height: {{fillPct}}; background: linear-gradient(0deg, rgba(227,176,75,0.38) 0%, rgba(227,176,75,0.06) 100%); border-top: 2px solid rgba(227,176,75,0.7)"></div>
<div style="position: relative; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding-top: 80px; box-sizing: border-box">
<div style="font-size: 28px; font-weight: 600; letter-spacing: 0.34em; color: #E3B04B">IQAMAH</div>
<div style="display: flex; align-items: baseline; gap: 22px">
<div style="font-family: 'Barlow Condensed', sans-serif; font-size: 84px; font-weight: 600; line-height: 1">Zohor</div>
<div style="font-family: 'Reem Kufi', sans-serif; font-size: 56px; color: rgba(255,255,255,0.75)">ظهر</div>
</div>
<div style="font-family: 'Barlow Condensed', sans-serif; font-size: 270px; font-weight: 600; letter-spacing: -4px; line-height: 0.92; font-variant-numeric: tabular-nums">{{remaining}}</div>
<div style="font-size: 30px; font-weight: 500; color: rgba(255,255,255,0.7)">minit lagi</div>
<div style="width: 80px; height: 2px; background: rgba(227,176,75,0.6); margin: 26px 0 10px"></div>
<div style="font-family: 'Amiri', serif; font-size: 52px; line-height: 1.3">سَوُّوا صُفُوفَكُمْ</div>
<div style="font-size: 34px; font-weight: 600">Luruskan dan rapatkan saf</div>
<div style="font-size: 24px; font-weight: 400; color: rgba(255,255,255,0.6); margin-top: 6px">Senyapkan telefon bimbit</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"progress":{"editor":"range","min":0,"max":1,"step":0.01,"default":0.23,"section":"Iqamah"},"totalMinutes":{"editor":"int","min":1,"max":30,"default":10,"section":"Iqamah"},"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    const progress = Math.min(1, Math.max(0, this.props.progress ?? 0.23));
    const total = (this.props.totalMinutes ?? 10) * 60;
    const left = Math.round(total * (1 - progress));
    const mm = Math.floor(left / 60), ss = left % 60;
    return {
      remaining: String(mm).padStart(2, '0') + ':' + String(ss).padStart(2, '0'),
      fillPct: (progress * 100).toFixed(1) + '%'
    };
  }
}
</script>
</body>
</html>
