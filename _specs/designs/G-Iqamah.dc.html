<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<title>Falak Iqamah</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Manrope:wght@200;300;500;700&display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1280px; height: 720px; box-sizing: border-box; padding: 28px 48px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; background: {{k.bg}}; color: #F7F1E3; font-family: 'Manrope', sans-serif">
  <div style="display: flex; align-items: center; gap: 14px">
    <svg width="26" height="32" viewBox="0 0 40 48" aria-hidden="true"><path d="M6 46V20a14 14 0 0 1 28 0v26" fill="none" stroke="#F7F1E3" stroke-width="4" stroke-linecap="round"/><circle cx="20" cy="24" r="5" fill="#E9BD63"/></svg>
    <div style="font-family: 'Fraunces', serif; font-weight: 600; font-size: 24px">Masjid Al-Hidayah</div>
  </div>
  <svg viewBox="-30 -30 460 460" width="520" height="520" role="img" aria-label="Kiraan detik iqamah">
    <circle cx="200" cy="200" r="165" fill="none" stroke="{{k.rim}}" stroke-width="14"/>
    <circle cx="200" cy="200" r="165" fill="none" stroke="#E9BD63" stroke-width="14" stroke-linecap="round" stroke-dasharray="{{d.dash}}" transform="rotate(-90 200 200)"/>
    <circle cx="200" cy="200" r="148" fill="{{k.plate}}"/>
    <g stroke="{{k.ink}}" stroke-linecap="round" opacity="0.5">
      <line x1="200" y1="62" x2="200" y2="80" stroke-width="5"/>
      <line x1="200" y1="62" x2="200" y2="78" stroke-width="2.5" transform="rotate(30 200 200)"/>
      <line x1="200" y1="62" x2="200" y2="78" stroke-width="2.5" transform="rotate(60 200 200)"/>
      <line x1="200" y1="62" x2="200" y2="80" stroke-width="5" transform="rotate(90 200 200)"/>
      <line x1="200" y1="62" x2="200" y2="78" stroke-width="2.5" transform="rotate(120 200 200)"/>
      <line x1="200" y1="62" x2="200" y2="78" stroke-width="2.5" transform="rotate(150 200 200)"/>
      <line x1="200" y1="62" x2="200" y2="80" stroke-width="5" transform="rotate(180 200 200)"/>
      <line x1="200" y1="62" x2="200" y2="78" stroke-width="2.5" transform="rotate(210 200 200)"/>
      <line x1="200" y1="62" x2="200" y2="78" stroke-width="2.5" transform="rotate(240 200 200)"/>
      <line x1="200" y1="62" x2="200" y2="80" stroke-width="5" transform="rotate(270 200 200)"/>
      <line x1="200" y1="62" x2="200" y2="78" stroke-width="2.5" transform="rotate(300 200 200)"/>
      <line x1="200" y1="62" x2="200" y2="78" stroke-width="2.5" transform="rotate(330 200 200)"/>
    </g>
    <text x="200" y="158" text-anchor="middle" font-size="16" font-weight="700" fill="{{k.sec}}" style="font-family: 'Manrope', sans-serif; letter-spacing: 0.18em">IQAMAH {{curUp}}</text>
    <text x="200" y="232" text-anchor="middle" font-size="86" font-weight="300" fill="{{k.ink}}" style="font-family: 'Manrope', sans-serif; font-variant-numeric: tabular-nums">{{mmss}}</text>
    <text x="200" y="262" text-anchor="middle" font-size="15" font-weight="500" fill="{{k.ink}}" opacity="0.7" style="font-family: 'Manrope', sans-serif">minit : saat</text>
  </svg>
  <div style="font-family: 'Fraunces', serif; font-weight: 500; font-size: 34px; text-align: center">Luruskan dan rapatkan saf</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"phase":{"editor":"enum","default":"Zohor","options":["Subuh","Zohor","Asar","Maghrib","Isyak"]},"face":{"editor":"enum","default":"light","options":["light","dark"]},"progress":{"editor":"range","default":40,"min":0,"max":100,"step":1},"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    const P = this.props;
    const ph = ['Subuh','Zohor','Asar','Maghrib','Isyak'].includes(P.phase) ? P.phase : 'Zohor';
    const name = {Subuh:'SUBUH',Zohor:'ZOHOR',Asar:'ASAR',Maghrib:'MAGHRIB',Isyak:'ISYAK'}[ph];
    const BG = {Subuh:'#26305E',Zohor:'#14566A',Asar:'#6A4E2A',Maghrib:'#7A2F3A',Isyak:'#0E1428'}[ph];
    const dark = P.face==='dark';
    const k = Object.assign({bg:BG, rim:'rgba(255,255,255,0.16)'}, dark
      ? {plate:'#12161C', ink:'#EFE7D3', sec:'#E3B25A'}
      : {plate:'#F7F1E3', ink:'#23252B', sec:'#8A4A12'});
    const p = Math.min(100, Math.max(0, Number(P.progress ?? 40)))/100;
    const rem = Math.round((1-p)*600);
    const Cc = 2*Math.PI*165;
    const mmss = String(Math.floor(rem/60)).padStart(2,'0')+':'+String(rem%60).padStart(2,'0');
    return { k, curUp:name, mmss, d:{ dash:(Cc*(1-p)).toFixed(1)+' '+Cc.toFixed(1) } };
  }
}
</script>
</body>
</html>
