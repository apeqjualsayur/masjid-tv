<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<title>Konsep F Tenang Iqamah</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500;600;700&amp;family=Noto+Naskh+Arabic:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2D7FA8}a:hover{color:#14303D}
</style>
</helmet>
<div style="position: relative; width: 1920px; height: 1080px; overflow: hidden; font-family: 'Manrope', sans-serif; background: {{t.bg}}; color: {{t.fg}}">

<div style="position: absolute; top: 72px; left: 112px; right: 112px; display: flex; justify-content: space-between; align-items: center; font-size: 24px; font-weight: 500">
<div>Nama Masjid / Surau</div>
<div style="color: {{t.muted}}; font-weight: 400">Azan {{w.name}} · {{w.time}}</div>
</div>

<div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center">
<div style="display: flex; align-items: center; gap: 14px; font-size: 34px; font-weight: 600; color: {{t.accent}}">
<div style="width: 12px; height: 12px; border-radius: 999px; background: {{t.accent}}"></div>
Iqamah {{w.name}}
</div>
<div style="font-size: 360px; font-weight: 300; letter-spacing: -16px; line-height: 1; font-variant-numeric: tabular-nums; margin-top: 10px">{{remaining}}</div>
<div style="position: relative; width: 1100px; height: 4px; border-radius: 2px; background: {{t.rule}}; margin-top: 20px">
<div style="position: absolute; left: 0; top: -2px; height: 8px; border-radius: 4px; width: {{barPct}}; background: {{t.accent}}"></div>
</div>
<div style="display: flex; align-items: center; gap: 28px; margin-top: 72px">
<div style="font-family: 'Noto Naskh Arabic', serif; font-size: 44px; color: {{t.muted}}">سَوُّوا صُفُوفَكُمْ</div>
<div style="width: 1px; height: 44px; background: {{t.rule}}"></div>
<div style="font-size: 38px; font-weight: 500">Luruskan dan rapatkan saf</div>
</div>
<div style="font-size: 26px; font-weight: 500; color: {{t.muted}}; margin-top: 18px">Senyapkan telefon bimbit</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"phase":{"editor":"enum","options":["subuh","zohor","asar","maghrib","isyak"],"default":"zohor","section":"Waktu"},"progress":{"editor":"range","min":0,"max":1,"step":0.01,"default":0.23,"section":"Iqamah"},"totalMinutes":{"editor":"int","min":1,"max":30,"default":10,"section":"Iqamah"},"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    const TH = {
      subuh:   { bg: '#E8EAF6', fg: '#1F2440', muted: '#5F6585', accent: '#4F58AE', rule: 'rgba(31,36,64,0.14)' },
      zohor:   { bg: '#EAF3F8', fg: '#14303D', muted: '#56707E', accent: '#23709A', rule: 'rgba(20,48,61,0.14)' },
      asar:    { bg: '#F8EFE6', fg: '#3B2A1E', muted: '#7E6853', accent: '#A9612A', rule: 'rgba(59,42,30,0.14)' },
      maghrib: { bg: '#F6E9EC', fg: '#3A2230', muted: '#80616E', accent: '#9C3F5E', rule: 'rgba(58,34,48,0.14)' },
      isyak:   { bg: '#131A2B', fg: '#E9ECF5', muted: '#8F98B3', accent: '#9DB0EE', rule: 'rgba(255,255,255,0.14)' }
    };
    const W = {
      subuh: { name: 'Subuh', time: '5:52' }, zohor: { name: 'Zohor', time: '1:05' }, asar: { name: 'Asar', time: '4:11' },
      maghrib: { name: 'Maghrib', time: '7:06' }, isyak: { name: 'Isyak', time: '8:16' }
    };
    const key = this.props.phase ?? 'zohor';
    const progress = Math.min(1, Math.max(0, this.props.progress ?? 0.23));
    const total = (this.props.totalMinutes ?? 10) * 60;
    const left = Math.round(total * (1 - progress));
    const mm = Math.floor(left / 60), ss = left % 60;
    return {
      t: TH[key] || TH.zohor, w: W[key] || W.zohor,
      remaining: String(mm).padStart(2, '0') + ':' + String(ss).padStart(2, '0'),
      barPct: ((1 - progress) * 100).toFixed(1) + '%'
    };
  }
}
</script>
</body>
</html>
