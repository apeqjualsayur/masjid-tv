<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<title>Kerawang Iqamah</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Manrope:wght@200;300;500;700&display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="position: relative; width: 1280px; height: 720px; overflow: hidden; background-color: {{j.bg}}; background-image: repeating-linear-gradient(90deg, rgba(0,0,0,0.06) 0px, rgba(0,0,0,0.06) 2px, transparent 2px, transparent 8px); color: #F6EBD4; font-family: 'Manrope', sans-serif">
  <svg width="0" height="0" style="position: absolute" aria-hidden="true">
    <defs>
      <pattern id="krwOn" width="48" height="48" patternUnits="userSpaceOnUse">
        <rect width="48" height="48" fill="#2E1B0F"/>
        <g fill="#F2C45A"><circle cx="24" cy="24" r="5"/><circle cx="24" cy="10" r="5"/><circle cx="24" cy="38" r="5"/><circle cx="10" cy="24" r="5"/><circle cx="38" cy="24" r="5"/>
        <path d="M0 -7L7 0L0 7L-7 0Z"/><path d="M0 -7L7 0L0 7L-7 0Z" transform="translate(48 0)"/><path d="M0 -7L7 0L0 7L-7 0Z" transform="translate(0 48)"/><path d="M0 -7L7 0L0 7L-7 0Z" transform="translate(48 48)"/></g>
      </pattern>
      <pattern id="krwOff" width="48" height="48" patternUnits="userSpaceOnUse">
        <rect width="48" height="48" fill="#2E1B0F"/>
        <g fill="#4E3120"><circle cx="24" cy="24" r="5"/><circle cx="24" cy="10" r="5"/><circle cx="24" cy="38" r="5"/><circle cx="10" cy="24" r="5"/><circle cx="38" cy="24" r="5"/>
        <path d="M0 -7L7 0L0 7L-7 0Z"/><path d="M0 -7L7 0L0 7L-7 0Z" transform="translate(48 0)"/><path d="M0 -7L7 0L0 7L-7 0Z" transform="translate(0 48)"/><path d="M0 -7L7 0L0 7L-7 0Z" transform="translate(48 48)"/></g>
      </pattern>
      <pattern id="awan" width="60" height="26" patternUnits="userSpaceOnUse">
        <path d="M0 13C10 0 20 0 30 13S50 26 60 13" fill="none" stroke="#D4A94E" stroke-width="3" stroke-linecap="round"/>
        <circle cx="15" cy="7" r="2.5" fill="#D4A94E"/><circle cx="45" cy="19" r="2.5" fill="#D4A94E"/>
      </pattern>
    </defs>
  </svg>
  <svg width="1280" height="26" style="position: absolute; left: 0; top: 0" aria-hidden="true"><rect width="1280" height="26" fill="#2E1B0F"/><rect width="1280" height="26" fill="url(#awan)"/></svg>
  <svg width="1280" height="26" style="position: absolute; left: 0; top: 694px" aria-hidden="true"><rect width="1280" height="26" fill="#2E1B0F"/><rect width="1280" height="26" fill="url(#awan)"/></svg>
  <div style="position: absolute; left: 90px; top: 56px; width: 440px; height: 608px; box-sizing: border-box; border: 6px solid #F2C45A; border-radius: 220px 220px 16px 16px; overflow: hidden; background: #2E1B0F; box-shadow: 0 0 60px 4px rgba(242,196,90,0.35)">
    <svg width="100%" height="100%" style="position: absolute; left: 0; top: 0; display: block" aria-hidden="true"><rect width="100%" height="100%" fill="url(#krwOff)"/></svg>
    <div style="position: absolute; left: 0; right: 0; bottom: 0; height: {{j.pct}}%; overflow: hidden; border-top: 3px solid #FFE9A8">
      <svg width="100%" height="596" style="position: absolute; left: 0; bottom: 0; display: block" aria-hidden="true"><rect width="100%" height="100%" fill="url(#krwOn)"/></svg>
    </div>
  </div>
  <div style="position: absolute; left: 600px; top: 56px; right: 70px; height: 608px; display: flex; flex-direction: column; justify-content: center; gap: 8px">
    <div style="display: flex; align-items: center; gap: 14px; margin-bottom: 18px">
      <svg width="30" height="36" viewBox="0 0 40 48" aria-hidden="true"><path d="M6 46V20a14 14 0 0 1 28 0v26" fill="none" stroke="#F2C45A" stroke-width="4" stroke-linecap="round"/><circle cx="20" cy="24" r="5" fill="#F6EBD4"/></svg>
      <div style="font-family: 'Fraunces', serif; font-weight: 600; font-size: 26px">Masjid Al-Hidayah</div>
    </div>
    <div style="font-size: 22px; font-weight: 700; letter-spacing: 0.22em; color: #F2C45A">IQAMAH {{curUp}}</div>
    <div style="font-size: 210px; font-weight: 200; line-height: 1; letter-spacing: -0.03em; font-variant-numeric: tabular-nums">{{mmss}}</div>
    <div style="font-family: 'Fraunces', serif; font-weight: 500; font-size: 38px; margin-top: 14px">Luruskan dan rapatkan saf</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"phase":{"editor":"enum","default":"Zohor","options":["Subuh","Zohor","Asar","Maghrib","Isyak"]},"progress":{"editor":"range","default":40,"min":0,"max":100,"step":1},"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    const P = this.props;
    const ph = ['Subuh','Zohor','Asar','Maghrib','Isyak'].includes(P.phase) ? P.phase : 'Zohor';
    const name = {Subuh:'SUBUH',Zohor:'ZOHOR',Asar:'ASAR',Maghrib:'MAGHRIB',Isyak:'ISYAK'}[ph];
    const BG = {Subuh:'#3F3552',Zohor:'#5E3D24',Asar:'#6C4626',Maghrib:'#5C2B27',Isyak:'#241A28'}[ph];
    const p = Math.min(100, Math.max(0, Number(P.progress ?? 40)))/100;
    const rem = Math.round((1-p)*600);
    const mmss = String(Math.floor(rem/60)).padStart(2,'0')+':'+String(rem%60).padStart(2,'0');
    return { j:{ bg:BG, pct:(p*100).toFixed(1) }, curUp:name, mmss };
  }
}
</script>
</body>
</html>
