<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<title>Log masuk</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#146C4A}a:hover{color:#0D4A33}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #F4F7F5; font-family: 'Plus Jakarta Sans', sans-serif; color: #12261E; box-sizing: border-box; padding: 20px 24px 28px; display: flex; flex-direction: column">
<div style="display: flex; justify-content: flex-end">
<div role="group" aria-label="Bahasa" style="display: flex; padding: 3px; border-radius: 999px; background: #E3ECE7">
<button type="button" onClick="{{setMs}}" style="height: 34px; padding: 0 14px; border: 0; border-radius: 999px; font: inherit; font-size: 13px; font-weight: 700; background: {{msBg}}; color: {{msFg}}">BM</button>
<button type="button" onClick="{{setEn}}" style="height: 34px; padding: 0 14px; border: 0; border-radius: 999px; font: inherit; font-size: 13px; font-weight: 700; background: {{enBg}}; color: {{enFg}}">EN</button>
</div>
</div>

<div style="display: flex; flex-direction: column; align-items: center; gap: 16px; margin-top: 64px; text-align: center">
<svg role="img" aria-label="Logo Masjid View" width="76" height="76" viewBox="0 0 76 76"><rect width="76" height="76" rx="22" fill="#146C4A"></rect><path d="M24 58V36a14 14 0 0 1 28 0v22Z" fill="#FFFFFF"></path><circle cx="38" cy="22" r="3.5" fill="#E3B04B"></circle><rect x="32" y="44" width="12" height="14" rx="6" fill="#146C4A"></rect></svg>
<div style="font-size: 30px; font-weight: 800; letter-spacing: -0.5px">Masjid View</div>
<div style="font-size: 15px; font-weight: 500; line-height: 1.5; color: #51655C; max-width: 290px">{{t.tagline}}</div>
</div>

<div style="display: flex; flex-direction: column; gap: 14px; margin-top: 56px">
<button type="button" style="height: 54px; border: 0; border-radius: 14px; background: #12261E; color: #FFFFFF; font: inherit; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 12px">
<span aria-hidden="true" style="width: 26px; height: 26px; border-radius: 999px; background: #FFFFFF; color: #12261E; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 800">G</span>
{{t.google}}
</button>
<div style="display: flex; align-items: center; gap: 12px; color: #6A7D74; font-size: 13px; font-weight: 600">
<div style="flex: 1; height: 1px; background: #D5E1DA"></div>{{t.or}}<div style="flex: 1; height: 1px; background: #D5E1DA"></div>
</div>
<label for="email" style="font-size: 13px; font-weight: 700; color: #3A4E45">{{t.emailLabel}}</label>
<input id="email" type="email" placeholder="nama@contoh.com" style="height: 52px; border: 1px solid #C9D8D0; border-radius: 14px; background: #FFFFFF; padding: 0 16px; font: inherit; font-size: 16px; color: #12261E; box-sizing: border-box; margin-top: -6px">
<button type="button" style="height: 52px; border: 1.5px solid #146C4A; border-radius: 14px; background: transparent; color: #146C4A; font: inherit; font-size: 15px; font-weight: 700">{{t.magic}}</button>
<div style="font-size: 13px; line-height: 1.5; color: #51655C; text-align: center">{{t.magicHint}}</div>
</div>

<div style="margin-top: auto; text-align: center; font-size: 13px; line-height: 1.6; color: #51655C">
{{t.legal}} <a href="#privasi" style="font-weight: 700">{{t.privacy}}</a>
<div style="margin-top: 10px">{{t.newMasjid}} <a href="Register.dc.html" style="font-weight: 700">{{t.register}}</a></div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"lang":{"editor":"enum","options":["ms","en"],"default":"ms","section":"Bahasa"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const L = {
      ms: { tagline: 'Paparan waktu solat dan pengumuman untuk TV masjid dan surau.', google: 'Teruskan dengan Google', or: 'atau', emailLabel: 'E-mel', magic: 'Hantar pautan log masuk', magicHint: 'Kami akan e-melkan pautan. Tiada kata laluan diperlukan.', legal: 'Dengan log masuk, anda bersetuju dengan', privacy: 'Notis Privasi', newMasjid: 'Masjid baharu?', register: 'Daftar percuma' },
      en: { tagline: 'Prayer times and announcements for masjid and surau TVs.', google: 'Continue with Google', or: 'or', emailLabel: 'Email', magic: 'Send me a sign-in link', magicHint: 'We will email you a link. No password needed.', legal: 'By signing in you agree to the', privacy: 'Privacy Notice', newMasjid: 'New masjid?', register: 'Register free' }
    };
    const lang = (this.state && this.state.lang) || this.props.lang || 'ms';
    const on = (k) => lang === k;
    return {
      t: L[lang] || L.ms,
      setMs: () => this.setState({ lang: 'ms' }), setEn: () => this.setState({ lang: 'en' }),
      msBg: on('ms') ? '#FFFFFF' : 'transparent', msFg: on('ms') ? '#12261E' : '#51655C',
      enBg: on('en') ? '#FFFFFF' : 'transparent', enFg: on('en') ? '#12261E' : '#51655C'
    };
  }
}
</script>
</body>
</html>
