<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<title>Seterusnya Iqamah</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;500;700;800&display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1280px; height: 720px; box-sizing: border-box; padding: 40px 64px 44px; display: flex; flex-direction: column; justify-content: space-between; background: {{k.bg}}; color: #FFFFFF; font-family: 'Manrope', sans-serif">
  <div style="display: flex; justify-content: space-between; align-items: center">
    <div style="display: flex; align-items: center; gap: 14px">
      <svg width="30" height="36" viewBox="0 0 40 48" aria-hidden="true"><path d="M6 46V20a14 14 0 0 1 28 0v26" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/><circle cx="20" cy="24" r="5" fill="#FFFFFF"/></svg>
      <div style="font-weight: 700; font-size: 24px">Masjid Al-Hidayah</div>
    </div>
    <div style="display: flex; gap: 40px">
      <div style="display: flex; flex-direction: column; align-items: flex-end">
        <div style="font-size: 13px; font-weight: 700; letter-spacing: 0.2em; opacity: 0.85">AZAN</div>
        <div style="font-size: 38px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums">{{azan}}</div>
      </div>
      <div style="display: flex; flex-direction: column; align-items: flex-end">
        <div style="font-size: 13px; font-weight: 700; letter-spacing: 0.2em; opacity: 0.85">IQAMAH</div>
        <div style="font-size: 38px; font-weight: 300; line-height: 1; font-variant-numeric: tabular-nums">{{iqamah}}</div>
      </div>
    </div>
  </div>
  <div style="display: flex; flex-direction: column; align-items: center">
    <div style="font-size: 24px; font-weight: 700; letter-spacing: 0.26em; opacity: 0.92">IQAMAH {{curUp}} DALAM</div>
    <div style="font-size: 330px; font-weight: 800; line-height: 1; letter-spacing: -0.04em; font-variant-numeric: tabular-nums">{{mmss}}</div>
    <div style="margin-top: 14px; width: 760px; height: 8px; border-radius: 999px; background: rgba(255,255,255,0.22)">
      <div style="width: {{pct}}%; height: 8px; border-radius: 999px; background: #FFFFFF"></div>
    </div>
  </div>
  <div style="font-weight: 700; font-size: 40px; text-align: center; letter-spacing: -0.01em">Luruskan dan rapatkan saf</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"phase":{"editor":"enum","default":"Zohor","options":["Subuh","Zohor","Asar","Maghrib","Isyak"]},"progress":{"editor":"range","default":40,"min":0,"max":100,"step":1},"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    const P = this.props;
    const ph = ['Subuh','Zohor','Asar','Maghrib','Isyak'].includes(P.phase) ? P.phase : 'Zohor';
    const C = {Subuh:1,Zohor:3,Asar:4,Maghrib:5,Isyak:6}[ph];
    const T = [['Imsak',5,39],['Subuh',5,49],['Syuruk',7,8],['Zohor',13,12],['Asar',16,28],['Maghrib',19,16],['Isyak',20,27]];
    const IQ = {1:15,3:10,4:10,5:5,6:10};
    const f = (h,m) => (h%12||12)+':'+String(m).padStart(2,'0');
    const tm = T[C][1]*60+T[C][2]+IQ[C];
    const BG = {Subuh:'#3A2F7A',Zohor:'#0E6C8A',Asar:'#9A5B10',Maghrib:'#A8323F',Isyak:'#101B4A'}[ph];
    const p = Math.min(100, Math.max(0, Number(P.progress ?? 40)))/100;
    const rem = Math.round((1-p)*600);
    const mmss = String(Math.floor(rem/60)).padStart(2,'0')+':'+String(rem%60).padStart(2,'0');
    return { k:{ bg:BG }, curUp:T[C][0].toUpperCase(), azan:f(T[C][1],T[C][2]), iqamah:f(Math.floor(tm/60)%24, tm%60), mmss, pct:((1-p)*100).toFixed(1) };
  }
}
</script>
</body>
</html>
