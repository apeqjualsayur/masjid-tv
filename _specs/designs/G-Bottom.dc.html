<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<title>Falak Bar Bawah</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Manrope:wght@300;500;700&display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1280px; height: 720px; display: flex; flex-direction: column; background: {{k.bg}}; color: #F7F1E3; font-family: 'Manrope', sans-serif">
  <div style="height: 556px; display: flex; gap: 0">
    <div style="width: 392px; flex: none; box-sizing: border-box; padding: 32px 24px 0 40px; display: flex; flex-direction: column; align-items: center; gap: 12px">
      <div style="align-self: flex-start; display: flex; align-items: center; gap: 12px">
        <svg width="28" height="34" viewBox="0 0 40 48" aria-hidden="true"><path d="M6 46V20a14 14 0 0 1 28 0v26" fill="none" stroke="#F7F1E3" stroke-width="4" stroke-linecap="round"/><circle cx="20" cy="24" r="5" fill="#E9BD63"/></svg>
        <div style="display: flex; flex-direction: column">
          <div style="font-family: 'Fraunces', serif; font-weight: 600; font-size: 22px; line-height: 1.1">Masjid Al-Hidayah</div>
          <div style="font-size: 13px; opacity: 0.78">Khamis · 29 Oktober 2026</div>
        </div>
      </div>
      <svg viewBox="-30 -30 460 460" width="330" height="330" role="img" aria-label="Jam analog">
        <circle cx="200" cy="200" r="165" fill="none" stroke="{{k.rim}}" stroke-width="14"/>
        <circle cx="200" cy="200" r="165" fill="none" stroke="#E9BD63" stroke-width="14" stroke-linecap="round" stroke-dasharray="{{d.arcDash}}" transform="rotate({{d.arcA}} 200 200)"/>
        <circle cx="200" cy="200" r="148" fill="{{k.plate}}"/>
        <g stroke="{{k.ink}}" stroke-linecap="round">
          <line x1="200" y1="62" x2="200" y2="80" stroke-width="6"/>
          <line x1="200" y1="62" x2="200" y2="78" stroke-width="3" transform="rotate(30 200 200)"/>
          <line x1="200" y1="62" x2="200" y2="78" stroke-width="3" transform="rotate(60 200 200)"/>
          <line x1="200" y1="62" x2="200" y2="80" stroke-width="6" transform="rotate(90 200 200)"/>
          <line x1="200" y1="62" x2="200" y2="78" stroke-width="3" transform="rotate(120 200 200)"/>
          <line x1="200" y1="62" x2="200" y2="78" stroke-width="3" transform="rotate(150 200 200)"/>
          <line x1="200" y1="62" x2="200" y2="80" stroke-width="6" transform="rotate(180 200 200)"/>
          <line x1="200" y1="62" x2="200" y2="78" stroke-width="3" transform="rotate(210 200 200)"/>
          <line x1="200" y1="62" x2="200" y2="78" stroke-width="3" transform="rotate(240 200 200)"/>
          <line x1="200" y1="62" x2="200" y2="80" stroke-width="6" transform="rotate(270 200 200)"/>
          <line x1="200" y1="62" x2="200" y2="78" stroke-width="3" transform="rotate(300 200 200)"/>
          <line x1="200" y1="62" x2="200" y2="78" stroke-width="3" transform="rotate(330 200 200)"/>
        </g>
        <rect x="156" y="250" width="88" height="40" rx="10" fill="{{k.ink}}" opacity="0.1"/>
        <text x="200" y="279" text-anchor="middle" font-size="28" font-weight="500" fill="{{k.ink}}" style="font-family: 'Manrope', sans-serif">{{now}}</text>
        <line x1="200" y1="200" x2="200" y2="120" stroke="{{k.hand}}" stroke-width="10" stroke-linecap="round" transform="rotate({{d.hd}} 200 200)"/>
        <line x1="200" y1="200" x2="200" y2="84" stroke="{{k.hand}}" stroke-width="6.5" stroke-linecap="round" transform="rotate({{d.md}} 200 200)"/>
        <line x1="200" y1="224" x2="200" y2="72" stroke="{{k.sec}}" stroke-width="3" stroke-linecap="round" transform="rotate({{d.sd}} 200 200)"/>
        <circle cx="200" cy="200" r="10" fill="{{k.sec}}"/>
        <circle cx="200" cy="200" r="4" fill="{{k.plate}}"/>
        <circle cx="{{d.m0.x}}" cy="{{d.m0.y}}" r="{{d.m0.r}}" fill="#E9BD63" stroke="{{k.bg}}" stroke-width="3" opacity="{{d.m0.op}}"/>
        <circle cx="{{d.m1.x}}" cy="{{d.m1.y}}" r="{{d.m1.r}}" fill="#E9BD63" stroke="{{k.bg}}" stroke-width="3" opacity="{{d.m1.op}}"/>
        <circle cx="{{d.m2.x}}" cy="{{d.m2.y}}" r="{{d.m2.r}}" fill="#E9BD63" stroke="{{k.bg}}" stroke-width="3" opacity="{{d.m2.op}}"/>
        <circle cx="{{d.m3.x}}" cy="{{d.m3.y}}" r="{{d.m3.r}}" fill="#E9BD63" stroke="{{k.bg}}" stroke-width="3" opacity="{{d.m3.op}}"/>
        <circle cx="{{d.m4.x}}" cy="{{d.m4.y}}" r="{{d.m4.r}}" fill="#E9BD63" stroke="{{k.bg}}" stroke-width="3" opacity="{{d.m4.op}}"/>
        <circle cx="{{d.m5.x}}" cy="{{d.m5.y}}" r="{{d.m5.r}}" fill="#E9BD63" stroke="{{k.bg}}" stroke-width="3" opacity="{{d.m5.op}}"/>
        <text x="{{d.m0.lx}}" y="{{d.m0.ly}}" text-anchor="middle" font-size="24" font-weight="700" fill="#E9BD63" opacity="{{d.m0.op}}" style="font-family: 'Manrope', sans-serif">Subuh</text>
        <text x="{{d.m1.lx}}" y="{{d.m1.ly}}" text-anchor="middle" font-size="24" font-weight="700" fill="#E9BD63" opacity="{{d.m1.op}}" style="font-family: 'Manrope', sans-serif">Syuruk</text>
        <text x="{{d.m2.lx}}" y="{{d.m2.ly}}" text-anchor="middle" font-size="24" font-weight="700" fill="#E9BD63" opacity="{{d.m2.op}}" style="font-family: 'Manrope', sans-serif">Zohor</text>
        <text x="{{d.m3.lx}}" y="{{d.m3.ly}}" text-anchor="middle" font-size="24" font-weight="700" fill="#E9BD63" opacity="{{d.m3.op}}" style="font-family: 'Manrope', sans-serif">Asar</text>
        <text x="{{d.m4.lx}}" y="{{d.m4.ly}}" text-anchor="middle" font-size="24" font-weight="700" fill="#E9BD63" opacity="{{d.m4.op}}" style="font-family: 'Manrope', sans-serif">Maghrib</text>
        <text x="{{d.m5.lx}}" y="{{d.m5.ly}}" text-anchor="middle" font-size="24" font-weight="700" fill="#E9BD63" opacity="{{d.m5.op}}" style="font-family: 'Manrope', sans-serif">Isyak</text>
      </svg>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 2px">
        <div style="font-size: 13px; font-weight: 700; letter-spacing: 0.16em; color: #E9BD63">● WAKTU {{curUp}}</div>
        <div style="font-size: 20px; font-weight: 500">{{nextName}} dalam {{remain}}</div>
      </div>
    </div>
    <div style="flex: 1; min-width: 0; box-sizing: border-box; padding: 32px 40px 24px 0; display: flex">
      <div style="flex: 1; background: #F7F1E3; color: #1B1D22; border-radius: 28px; padding: 48px 52px; display: flex; flex-direction: column; gap: 22px; position: relative">
        <div style="align-self: flex-start; font-size: 14px; font-weight: 700; letter-spacing: 0.16em; padding: 8px 16px; border-radius: 999px; background: #1B1D22; color: #F7F1E3">PENGUMUMAN AM</div>
        <div style="font-family: 'Fraunces', serif; font-weight: 600; font-size: 64px; line-height: 1.05">Kuliah Maghrib Khamis</div>
        <div style="font-size: 26px; line-height: 1.45; color: #3A3D45">Bersama Ustaz [Nama Penceramah]. Bermula selepas solat Maghrib di dewan solat utama.</div>
        <div style="margin-top: auto; display: flex; justify-content: space-between; align-items: center; font-size: 20px; color: #3A3D45">
          <div>Semua jemaah dijemput hadir</div>
          <div style="font-size: 13px; letter-spacing: 0.12em; opacity: 0.6">CONTOH TEMPLAT</div>
        </div>
      </div>
    </div>
  </div>
  <div style="flex: 1; display: flex; align-items: stretch; padding: 0 20px; background: rgba(0,0,0,0.26)">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="7">
      <div style="flex: 1; margin: 16px 6px; border-radius: 18px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; background: {{r.bg}}; color: {{r.fg}}; opacity: {{r.op}}">
        <div style="font-family: 'Fraunces', serif; font-weight: 500; font-size: 22px">{{r.name}}</div>
        <div style="font-size: 42px; font-weight: 500; font-variant-numeric: tabular-nums; line-height: 1.1">{{r.time}}</div>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"phase":{"editor":"enum","default":"Zohor","options":["Subuh","Zohor","Asar","Maghrib","Isyak"]},"face":{"editor":"enum","default":"light","options":["light","dark"]},"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    const P = this.props;
    const ph = ['Subuh','Zohor','Asar','Maghrib','Isyak'].includes(P.phase) ? P.phase : 'Zohor';
    const N = {Subuh:[6,12],Zohor:[13,42],Asar:[16,55],Maghrib:[19,30],Isyak:[21,10]}[ph];
    const C = {Subuh:1,Zohor:3,Asar:4,Maghrib:5,Isyak:6}[ph];
    const X = {Subuh:2,Zohor:4,Asar:5,Maghrib:6,Isyak:1}[ph];
    const T = [['Imsak',5,39],['Subuh',5,49],['Syuruk',7,8],['Zohor',13,12],['Asar',16,28],['Maghrib',19,16],['Isyak',20,27]];
    const f = (h,m) => (h%12||12)+':'+String(m).padStart(2,'0');
    const nowM = N[0]*60+N[1];
    let nx = T[X][1]*60+T[X][2]; if (nx<=nowM) nx+=1440;
    const left = nx-nowM;
    const BG = {Subuh:'#26305E',Zohor:'#14566A',Asar:'#6A4E2A',Maghrib:'#7A2F3A',Isyak:'#0E1428'}[ph];
    const dark = P.face==='dark';
    const k = Object.assign({bg:BG, pill:'#F7F1E3', pillInk:'#1B1D22', rim:'rgba(255,255,255,0.16)'}, dark
      ? {plate:'#12161C', ink:'#EFE7D3', hand:'#F3EBD8', sec:'#E3B25A'}
      : {plate:'#F7F1E3', ink:'#23252B', hand:'#1D1F24', sec:'#B3541E'});
    const ang = (m) => ((m/60)%12)*30;
    const R = 165, Cc = 2*Math.PI*R;
    const sa = ang(T[C][1]*60+T[C][2]);
    const span = (ang(nowM)-sa+360)%360;
    const d = { arcA:(sa-90).toFixed(1), arcDash:(Cc*span/360).toFixed(1)+' '+Cc.toFixed(1), hd:(((N[0]%12)+N[1]/60)*30).toFixed(1), md:((N[1]+27/60)*6).toFixed(1), sd:162 };
    [1,2,3,4,5,6].forEach((i,j) => {
      const pm = T[i][1]*60+T[i][2];
      const dt = (pm-nowM+1440)%1440;
      const a = ang(pm)*Math.PI/180;
      d['m'+j] = { x:(200+R*Math.sin(a)).toFixed(1), y:(200-R*Math.cos(a)).toFixed(1), lx:(200+205*Math.sin(a)).toFixed(1), ly:(200-205*Math.cos(a)+8).toFixed(1), r: i===C?12:8, op: (i===C || (dt>0 && dt<=720)) ? 1 : 0 };
    });
    return {
      k, d, now:f(N[0],N[1]), curUp:T[C][0].toUpperCase(), nextName:T[X][0],
      remain: Math.floor(left/60)+'j '+(left%60)+'m',
      rows: T.map((t,i) => ({ name:t[0], time:f(t[1],t[2]), bg:i===C?k.pill:'transparent', fg:i===C?k.pillInk:'#F7F1E3', op:((i===0||i===2)&&i!==C)?0.74:1 }))
    };
  }
}
</script>
</body>
</html>
