<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<title>Pilih templat</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#146C4A}a:hover{color:#0D4A33}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #F4F7F5; font-family: 'Plus Jakarta Sans', sans-serif; color: #12261E; box-sizing: border-box; padding: 16px 20px 24px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: center; justify-content: space-between">
<div style="font-size: 22px; font-weight: 800">Kandungan baru</div>
<a href="Content.dc.html" aria-label="Tutup" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #12261E"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12 M18 6 6 18"></path></svg></a>
</div>
<a href="Poster.dc.html" style="display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 16px; background: #146C4A; color: #FFFFFF; text-decoration: none">
<svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"></rect><circle cx="9" cy="9" r="2"></circle><path d="M21 15l-5-5L5 21"></path></svg>
<div style="display: flex; flex-direction: column; gap: 2px"><div style="font-size: 15px; font-weight: 800">Muat naik poster</div><div style="font-size: 12px; opacity: 0.85">Saiz disyorkan ditunjukkan ikut skrin anda</div></div>
</a>
<div style="font-size: 13px; font-weight: 800; color: #51655C; letter-spacing: 0.04em">ATAU PILIH TEMPLAT</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<sc-for list="{{tpls}}" as="t" hint-placeholder-count="10">
<a href="{{t.href}}" style="display: flex; flex-direction: column; gap: 8px; padding: 14px; border-radius: 16px; background: #FFFFFF; box-shadow: 0 1px 3px rgba(18,38,30,0.08); text-decoration: none; color: #12261E; min-height: 96px; box-sizing: border-box">
<div style="width: 34px; height: 34px; border-radius: 10px; background: {{t.bg}}; color: {{t.fg}}; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 800">{{t.code}}</div>
<div style="font-size: 14px; font-weight: 800; line-height: 1.2">{{t.name}}</div>
<div style="font-size: 12px; line-height: 1.35; color: #51655C">{{t.desc}}</div>
</a>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const tpls = [
      ['PNG', 'Pengumuman Am', 'Tajuk dan teks ringkas', '#E6EEF8', '#1F4E8A'],
      ['KUL', 'Kuliah / Ceramah', 'Tajuk, penceramah, masa', '#E3F1EA', '#146C4A'],
      ['KEM', 'Kematian', 'Solat jenazah, tamat auto', '#ECECEC', '#3A3A3A'],
      ['PRG', 'Program', 'Tarikh, tempat, hubungi', '#E3F4F4', '#11666A'],
      ['INF', 'Kutipan / Infaq', 'Sasaran, kemajuan, QR', '#FFF1D6', '#8A5300'],
      ['MES', 'Mesyuarat', 'Notis rasmi AJK', '#F7EAE3', '#8A3F14'],
      ['I&B', 'Imam & Bilal', 'Jadual mingguan', '#EEE8F7', '#5B3D8F'],
      ['RM', 'Penyata Kewangan', 'Kutipan, belanja, baki', '#E8F0E3', '#3E6A1F'],
      ['AYT', 'Ayat / Hadith', 'Daripada sumber sahih', '#F3EEDF', '#6E5A1E'],
      ['UCP', 'Ucapan Perayaan', 'Aidilfitri, Aidiladha…', '#FBE8EE', '#8A2A4A']
    ].map(([code, name, desc, bg, fg], i) => ({ code, name, desc, bg, fg, href: i === 1 ? 'Editor.dc.html' : '#templat' }));
    return { tpls };
  }
}
</script>
</body>
</html>
