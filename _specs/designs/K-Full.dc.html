<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<title>Seterusnya Penuh</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;500;700;800&display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1280px; height: 720px; box-sizing: border-box; padding: 36px 64px 34px; display: flex; flex-direction: column; gap: 14px; background: {{k.bg}}; color: #FFFFFF; font-family: 'Manrope', sans-serif">
  <div style="height: 64px; display: flex; justify-content: space-between; align-items: center">
    <div style="display: flex; align-items: center; gap: 14px">
      <svg width="30" height="36" viewBox="0 0 40 48" aria-hidden="true"><path d="M6 46V20a14 14 0 0 1 28 0v26" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/><circle cx="20" cy="24" r="5" fill="#FFFFFF"/></svg>
      <div style="display: flex; flex-direction: column">
        <div style="font-weight: 700; font-size: 24px; line-height: 1.15">Masjid Al-Hidayah</div>
        <div style="font-size: 14px; opacity: 0.85">Khamis · 29 Oktober 2026</div>
      </div>
    </div>
    <div style="display: flex; align-items: baseline; gap: 16px">
      <div style="font-size: 15px; font-weight: 700; letter-spacing: 0.16em; opacity: 0.9">WAKTU {{curUp}}</div>
      <div style="font-size: 58px; font-weight: 300; line-height: 1; font-variant-numeric: tabular-nums">{{now}}</div>
    </div>
  </div>
  <div style="flex: 1; display: flex; align-items: center; gap: 36px">
    <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px">
      <div style="font-size: 20px; font-weight: 700; letter-spacing: 0.26em; opacity: 0.88">SETERUSNYA</div>
      <div style="font-size: 132px; font-weight: 800; line-height: 1; letter-spacing: -0.03em">{{hero.name}}</div>
      <div style="display: flex; gap: 64px; margin-top: 10px">
        <div style="display: flex; flex-direction: column">
          <div style="font-size: 16px; font-weight: 700; letter-spacing: 0.2em; opacity: 0.85">AZAN</div>
          <div style="font-size: 92px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums">{{hero.azan}}</div>
        </div>
        <div style="display: flex; flex-direction: column">
          <div style="font-size: 16px; font-weight: 700; letter-spacing: 0.2em; opacity: 0.85">IQAMAH</div>
          <div style="font-size: 92px; font-weight: 300; line-height: 1; font-variant-numeric: tabular-nums">{{hero.iqamah}}</div>
        </div>
      </div>
    </div>
    <div style="position: relative; width: 340px; height: 340px; flex: none">
      <svg viewBox="0 0 340 340" width="340" height="340" role="img" aria-label="Baki masa ke waktu seterusnya">
        <circle cx="170" cy="170" r="150" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="18"/>
        <circle cx="170" cy="170" r="150" fill="none" stroke="#FFFFFF" stroke-width="18" stroke-linecap="round" stroke-dasharray="{{ring.dash}}" transform="rotate(-90 170 170)"/>
      </svg>
      <div style="position: absolute; left: 0; top: 0; width: 340px; height: 340px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0">
        <div style="font-size: 62px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums">{{remain}}</div>
        <div style="font-size: 18px; opacity: 0.85; margin-top: 6px">lagi ke {{hero.name}}</div>
      </div>
    </div>
  </div>
  <div style="height: 112px; display: flex; gap: 10px">
    <sc-for list="{{cells}}" as="c" hint-placeholder-count="7">
      <div style="flex: 1; border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0; box-sizing: border-box; border: 2px solid {{c.bd}}; background: {{c.bg}}; color: {{c.fg}}">
        <div style="font-size: 17px; font-weight: 700">{{c.name}}</div>
        <div style="font-size: 34px; font-weight: 500; line-height: 1.1; font-variant-numeric: tabular-nums">{{c.azan}}</div>
        <div style="font-size: 14px; opacity: 0.85; min-height: 17px">{{c.iq}}</div>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"phase":{"editor":"enum","default":"Zohor","options":["Subuh","Zohor","Asar","Maghrib","Isyak"]},"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    const P = this.props;
    const ph = ['Subuh','Zohor','Asar','Maghrib','Isyak'].includes(P.phase) ? P.phase : 'Zohor';
    const N = {Subuh:[6,12],Zohor:[13,42],Asar:[16,55],Maghrib:[19,30],Isyak:[21,10]}[ph];
    const C = {Subuh:1,Zohor:3,Asar:4,Maghrib:5,Isyak:6}[ph];
    const X = {Subuh:2,Zohor:4,Asar:5,Maghrib:6,Isyak:1}[ph];
    const T = [['Imsak',5,39],['Subuh',5,49],['Syuruk',7,8],['Zohor',13,12],['Asar',16,28],['Maghrib',19,16],['Isyak',20,27]];
    const IQ = {1:15,3:10,4:10,5:5,6:10};
    const f = (h,m) => (h%12||12)+':'+String(m).padStart(2,'0');
    const iq = (i) => { if (IQ[i]===undefined) return '—'; const tm = T[i][1]*60+T[i][2]+IQ[i]; return f(Math.floor(tm/60)%24, tm%60); };
    const nowM = N[0]*60+N[1];
    const cs = T[C][1]*60+T[C][2];
    let nx = T[X][1]*60+T[X][2]; if (nx<=nowM) nx+=1440;
    const left = nx-nowM;
    const frac = Math.min(1, Math.max(0, 1-(nowM-cs)/(nx-cs)));
    const Cc = 2*Math.PI*150;
    const BG = {Subuh:'#3A2F7A',Zohor:'#0E6C8A',Asar:'#9A5B10',Maghrib:'#A8323F',Isyak:'#101B4A'}[ph];
    return {
      k:{ bg:BG }, now:f(N[0],N[1]), curUp:T[C][0].toUpperCase(),
      remain: Math.floor(left/60)+'j '+(left%60)+'m',
      hero:{ name:T[X][0].toUpperCase(), azan:f(T[X][1],T[X][2]), iqamah:iq(X) },
      ring:{ dash:(Cc*frac).toFixed(1)+' '+Cc.toFixed(1) },
      cells: T.map((t,i) => ({
        name:t[0], azan:f(t[1],t[2]), iq: IQ[i]!==undefined ? 'iqamah '+iq(i) : '',
        bd: i===C ? '#FFFFFF' : 'transparent', bg: i===X ? '#FFFFFF' : 'rgba(255,255,255,0.12)', fg: i===X ? BG : '#FFFFFF'
      }))
    };
  }
}
</script>
</body>
</html>
